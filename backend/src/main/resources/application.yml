server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pentaworks-backend
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/pentaworks_mri_db}
    username: ${DB_USERNAME:pos21}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: 1
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

management:
  health:
    mail:
      enabled: ${MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  company-documents:
    directory: ${COMPANY_DOCUMENTS_DIRECTORY:./data/company-documents}
  dashboard:
    refresh-ms: ${DASHBOARD_REFRESH_MS:10000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:43200}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:365}
    secure-cookie: ${JWT_SECURE_COOKIE:false}
  monitor:
    cron-secret: ${CRON_SECRET:}
    slack-webhook-url: ${SLACK_WEBHOOK_URL:}
    scheduler-enabled: ${MONITOR_SCHEDULER_ENABLED:false}
    interval-ms: ${MONITOR_INTERVAL_MS:60000}
    initial-delay-ms: ${MONITOR_INITIAL_DELAY_MS:60000}
  office-integration:
    enabled: ${OFFICE_INTEGRATION_ENABLED:false}
    base-url: ${OFFICE_BASE_URL:http://office-backend:8080}
    api-key: ${OFFICE_API_KEY:}
  mrtb-sync:
    enabled: ${MRTB_SYNC_ENABLED:false}
    url: ${MRTB_SYNC_DB_URL:}
    username: ${MRTB_SYNC_DB_USERNAME:}
    password: ${MRTB_SYNC_DB_PASSWORD:}
    interval-ms: ${MRTB_SYNC_INTERVAL_MS:10000}
    batch-size: ${MRTB_SYNC_BATCH_SIZE:1000}
    max-batches-per-run: ${MRTB_SYNC_MAX_BATCHES_PER_RUN:100}
