server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pentaworks-backend
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/pentaworks_mri_db}
    username: ${DB_USERNAME:pos21}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: 1
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:43200}
  monitor:
    cron-secret: ${CRON_SECRET:}
    slack-webhook-url: ${SLACK_WEBHOOK_URL:}
  office-integration:
    enabled: ${OFFICE_INTEGRATION_ENABLED:false}
    base-url: ${OFFICE_BASE_URL:http://office-backend:8080}
    api-key: ${OFFICE_API_KEY:}
