services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mariadb://database:3306/pentaworks_mri_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8180}:8080"
    networks:
      - app
      - shared_database

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3100}:3000"
    depends_on:
      - backend
    networks:
      - app

networks:
  app:
  shared_database:
    external: true
    name: pentaworks_default
