services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mariadb://database:3306/pentaworks_mri_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-43200}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-365}
      JWT_SECURE_COOKIE: ${JWT_SECURE_COOKIE:-true}
      CRON_SECRET: ${CRON_SECRET}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://app.pentaworks.net}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      OFFICE_INTEGRATION_ENABLED: "true"
      OFFICE_BASE_URL: ${OFFICE_BASE_URL:-http://office-backend:8080}
      OFFICE_API_KEY: ${OFFICE_API_KEY:?OFFICE_API_KEY is required}
      MRTB_SYNC_ENABLED: ${MRTB_SYNC_ENABLED:-false}
      MRTB_SYNC_DB_URL: ${MRTB_SYNC_DB_URL:-jdbc:mariadb://192.168.0.89:3306/mrdb?connectTimeout=5000&socketTimeout=10000}
      MRTB_SYNC_DB_USERNAME: ${MRTB_SYNC_DB_USERNAME:-pos21}
      MRTB_SYNC_DB_PASSWORD: ${MRTB_SYNC_DB_PASSWORD:-}
      MRTB_SYNC_INTERVAL_MS: ${MRTB_SYNC_INTERVAL_MS:-10000}
      MRTB_SYNC_BATCH_SIZE: ${MRTB_SYNC_BATCH_SIZE:-1000}
      MRTB_SYNC_MAX_BATCHES_PER_RUN: ${MRTB_SYNC_MAX_BATCHES_PER_RUN:-100}
      COMPANY_DOCUMENTS_DIRECTORY: /app/data/company-documents
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8180}:8080"
    networks:
      - app
      - shared_database
      - integration
    volumes:
      - company_documents:/app/data/company-documents

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3100}:3000"
    depends_on:
      - backend
    networks:
      - app

networks:
  app:
  shared_database:
    external: true
    name: pentaworks_default
  integration:
    external: true
    name: pentaworks-integration

volumes:
  company_documents:
