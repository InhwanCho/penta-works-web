services:
  database:
    image: mariadb:10.11
    container_name: pentaworks-mri-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: pentaworks_mri_db
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - pentaworks_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mariadb://database:3306/pentaworks_mri_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-43200}
      CRON_SECRET: ${CRON_SECRET}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      OFFICE_INTEGRATION_ENABLED: "true"
      OFFICE_BASE_URL: ${OFFICE_BASE_URL:-http://office-backend:8080}
      OFFICE_API_KEY: ${OFFICE_API_KEY:?OFFICE_API_KEY is required}
      TZ: Asia/Seoul
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      default:
      integration:

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pentaworks_mariadb_data:
    external: true
    name: homepage_mariadb_data

networks:
  integration:
    external: true
    name: pentaworks-integration
